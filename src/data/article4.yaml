audioTitle: Дмитрий Борисов — «Геомеханика»
audioLength: 1:21
title: Морской геолог Дмитрий Борисов и музыка океана
blocks:
  - type: text
    text: >-
      <p><b>«Геомеханика»</b> — трек, созданный с помощью сканера, которым изучают породы со дна морей и океанов. Сканер позволяет «читать» историю Земли по слоям ила, вулканического пепла, обломков горных пород и остатков микроорганизмов — словно записи со старинной пластинки. Трек записал морской геолог Дмитрий Борисов, а сводить его помог музыкальный продюсер Тимур Гауф, работавший с Бастой и другими звездами.</p>
  - type: quote
    text: >-
      <p>«Сканер — это мой основной рабочий инструмент. Эта большая тяжелая автоматическая система стоит в Институте океанологии. Сканер делает сотни тысяч снимков кернов — образцов геологических пород — и одновременно “поёт”: мотор издаёт звуки, похожие на волынку.</p>

      <p>Сотни тысяч фотографий сшиваются в единое изображение, которое весит больше 1 Гб. Затем сканер проводит сотни измерений магнитной восприимчивости и цвета осадков, анализирует их химический состав по всей длине кернов. Все делается автоматически, оператору нужно лишь правильно задать программу исследований»</p>
    desc: Дмитрий Борисов, морской геолог, наставник Плавучего университета
    ava: ava4.jpg
  - type: illustration
    desc: Ускоренное видео, на котором показан процесс исследования кернов с помощью сканера
    image: MSCL-log3.mp4
  - type: text
    text: >-
      <p>Керны — это срезы донных отложений. Их добывают в море во время научных экспедиций. Добыть керн — целая задача. Необходимо приехать в нужную точку, погрузить оборудование на несколько километров под воду и достать образец. После этого его можно изучать в лаборатории.</p>
  - type: quote
    desc: Дмитрий Борисов, морской геолог, наставник Плавучего университета
    text: >-
      «Для меня важным геологическим открытием стали особые донные осадки, образованные под действием течений, — контуриты. Это главный объект моих исследований. На дне океана неспокойно: течения, вызванные разницей плотности воды, движутся вдоль океанского дна. Они совершают колоссальную геологическую работу: размывают илы и породы, переносят взвесь, формируют слои контуритов. В составе и свойствах контуритов течения записывают информацию о том, куда и как быстро двигались древние океанские воды тысячи и миллионы лет назад»
    ava: ava4.jpg
  - type: text
    text: >-
      <p>Морские исследовательские экспедиции в России организовывает в том числе научно-образовательный проект «Плавучий университет». Каждый год команды из научных наставников и студентов выходят в море, чтобы собрать материал для новых открытий. Благодаря их исследованиям мир узнает об истории планеты и учится прогнозировать ее будущее, анализирует риски природных катастроф и строит новые климатические модели, ищет полезные ископаемые и находит новые виды морских обитателей. Все это помогает решать фундаментальные и прикладные задачи в области наук о Земле.</p>
  - type: illustration
    style: big
    desc: Вид с ходового мостика на просторы Арктики в экспедиции Плавучего университета
    image: ill4_2.jpg
