title: Астрофизик Николай Кардашев и музыка звёзд
blocks:
  - type: text
    text: >-
      <p>«Радиоастрон» — космический проект, участники которого более 40&nbsp;лет изучали звёзды и чёрные дыры. Завершая последний цикл исследований, российские учёные вместе с музыкантами создали трек с «оркестром» из 26 пульсаров, сигналы которых записал спутник «Спектр-Р». Альбом стал «лебединой песней» уникального научного аппарата.</p>
  - type: illustration
    style: big
    desc: Роскосмос опубликовал в своих соцсетях видео в память о проекте «Спектр-Р»
    vkvideo: https://vkvideo.ru/video-33119141_456240032
    # image: ill5_1.jpg
  - type: text
    text: >-
      <p>«Спектр-Р» — уникальный спутник-телескоп, запущенный в космос Россией. Он делал самые четкие на тот момент снимки Вселенной — 7 микросекунд дуги при базе 340 000 км. Но в 2019 году связь с ним прервалась, и проект закрыли.</p>
  - type: illustration
    desc: «Спектр-Р» — уникальный спутник-телескоп, запущенный в космос Россией
    image: ill5_2.png
  - type: text
    text: >-
      <p>Пульсар — это сердце будущей звезды, которое появляется после смерти сверхновой и состоит почти полностью из нейтронов. Это гигантское пульсирующее тело, которое вращается со скоростью до сотни раз в секунду и часто мигает, испуская в пространство узкие лучи радиоволн. Пульсары — это космические маяки. Их сигналы можно использовать как эталоны времени на Земле.</p>    
      <p>К открытию пульсаров одним из первых еще шестьдесят лет назад подошел астрофизик Николай Семенович Кардашев (1932–2019). Он утверждал, что компактный радиоисточник в Крабовидной туманности является сверхнамагниченной быстровращающейся нейтронной звездой.</p>
  - type: quote
    desc: Николай Кардашев, астрофизик
    text: >-
      «Пульсары нас удивили. Вместо одного объекта мы видим множество, иногда сотни звездочек. На самом деле физически это не так, но из-за особенностей аппаратуры сигнал расщепляется и создает такую иллюзию. Это помеха, но ее можно использовать в научных целях: например, изучать дальность объектов друг от друга»
    ava: ava5.jpg
  - type: text
    text: >-
      <p>Изучая пульсары, человечество готовит почву для создания технологий и понимает свое место во Вселенной. Уже сейчас пульсары помогают проверить фундаментальные законы физики, например теорию относительности. Они помогают понять жизненный цикл звезд и процессы, в которых рождаются тяжелые металлы. В будущем их биение можно использовать для навигации межпланетных кораблей.</p>
