title: Инженеры инноватики Александра Михайлова и Екатерина Кулакова и музыка водорослей
blocks:
  - type: text
    text: >-
      <p><a href="https://art.itmo.ru/blog/projects/tproduct/726017913-678297516911-sos-sound-of-survivor" target="_blank">«SOS: Sound of Survivor»</a> — художественно-научный проект о влиянии звука на микроводоросли. В нем с помощью звуковых волн человек может войти в контакт с древнейшей формой жизни — водорослям вида Chlorella vulgaris.</p>
      <p>Для проекта команда Acousmatic group из университета ИТМО разрабатывает биореактор для культивации микроорганизмов. Прототип выглядит как бассейн с установкой звуковых волн и датчиками движения.</p>
  - type: quote
    text: «Название проекта выбрано не случайно. SOS в нашем случае это не сигнал тревоги или зов о помощи, а звук выжившего, отклик живой материи. Для нас это способ исследовать не только науку, но и искусство общения с природой»
    desc: Екатерина Кулакова, инженер инноватики, мультимедийный художник
    ava: ava3_1.jpg
  - type: text
    text: >-
      <p>Проводя рукой над датчиком, зритель запускает изменения в мелодии, вибрации которой насыщают водоем углекислым газом, нужным для жизни водорослей. При взаимодействии на поверхности бассейна появляются узоры, которые известны как рябь Фарадея.</p>
  - type: illustration
    desc: На фото Екатерина Кулакова «общается» с водорослями
    image: ill3_1.jpg
  - type: text
    text: >-
      <p>Рябь Фарадея — состояние волны, которое возникает при вибрации жидкости. Мелодия, пронизывающая бассейн, похожа на белый шум. Таким может быть язык для общения с микроорганизмами.</p>
      <p>Музыкальный паттерн в проекте разработали инженеры инноватики Александра Михайлова и Екатерина Кулакова, они настроили оборудование и вырастили микроорганизмы в лаборатории. Консультировал исследовательниц биолог Алексей Видлер.</p>
  - type: quote
    desc: >-
      Александра Михайлова, инженер инноватики, мультимедийных художник
    text: >-
      «В нашем проекте мы визуализируем влияние человека на мир: каждый наш жест несет созидание или разрушение. Когда человек проводит рукой над датчиками установки, поверхность чашки Петри колеблется и условия существования микроорганизмов меняются — так мы проявляем акусматический звук, источник которого не видим»
    ava: ava3_2.jpg
  - type: text
    text: >-
      <p>Микроводоросли — удивительная форма жизни. Они выживают во льдах Антарктики и в пустынях, выдерживая экстремально высокие и низкие температуры. Они покрывают большую часть планеты, вырабатывают кислород и становятся пищей для млекопитающих. Под воздействием ультразвука водоросли растут активнее.</p>
  - type: illustration
    desc: >-
      Это — вибрация на поверхности Чашки&nbsp;Петри при воздействии звука
    image: ill3_3.mp4
    style: round
  - type: quote
    desc: >-
      Алексей Видлер, биолог
    text: >-
      «Микроводоросли — неоценимый ресурс человечества. Это “суперфуд”, в них содержится до 60–70% белка, а также аминокислоты, антиоксиданты. Это источник активных веществ для фармацевтической промышленности и косметологии — антибактериальных лекарств и противовирусных. Наконец, это сырье для биотоплива. Людям выгодно разобраться, как выращивать как можно больше микроорганизмов»
    ava: ava3_3.jpg
