title: Инфохимик Павел Зун и музыка микрокапель
blocks:
  - type: text
    text: >-
      <p><b>«Микрооркестр левитирующих капель»</b> — научный проект, где мир химических реакций превратился в настоящий концерт. Для этого был создан капельный кластер, состоящий из парящих над поверхностью теплой воды микрокапель. Они «общаются» между собой посредством крошечных вспышек света и под различным воздействием выстраиваются в определённые композиции.</p>
      <p>В будущем такие исследования позволят создавать компьютеры на основе химических вычислителей, которые в отдельных задачах могут быть эффективнее кремниевых: например, чтобы рассчитать вероятность образования циклона, вычислить активное вещество бактерий или понять, как быстро будет распространяться вирус.</p>
      <p>Ученые из института X-BIO при Тюменском госуниверситете и университета ИТМО в Санкт-Петербурге прицельно изучают капельные кластеры.</p>
      <p>Ученые из Тюмени разработали специальную установку для изучения феномена. В природе капельные кластеры устроены хаотично: например, в тумане микрочастицы перемещаются в произвольном порядке. В установке же частицы упорядочены, порядок зависит от условий в установке — температуры, наклона.</p>
  - type: illustration
    desc: >-
      Установка в институте X-BIO для изучения кластеров: ученые могут наблюдать за «общением» капель на экране монитора
    image: ill2_1.jpg
  - type: text
    text: >-
      <p>Инфохимик Павел Зун вместе с коллегами смог описать в деталях, как происходит «общение» капель. В определенный момент в частицах образуются супермолекулярные кристаллы, которые мерцают. Это мерцание отражается в соседях.</p>

  - type: quote
    text: «При внешнем освещении кристаллы дают вспышки отраженного света с разной частотой, которая связана с формой кристалла и вращением капли. В таких мерцаниях может быть закодирована полезная информация о взаимодействии микрокапель»
    desc: Павел Зун, инфохимик
    ava: ava2.jpg
  - type: text
    text: >-
      <p>«Общение» капель может увидеть любой желающий. Ученые отсняли процесс на камеру, загрузили снимки в нейросеть и запрограммировали ее на то, чтобы составить карту динамики мерцаний капель в разных частях кластера. В зависимости от частоты и интенсивности мерцания капель каждой из них был присвоен свой цвет и звук.</p>
      <p>Теперь у каждой частицы есть своя «партитура», ученые могут «дирижировать» каплями внутри кластера, изменяя температуру нагрева поверхности воды. А мы слышим это в природной мелодии, похожей на джазовую. Однажды эта музыка поможет человечеству изобретать удивительные вещи.</p>
  - type: illustration
    desc: Каждая капля уникальна и имеет свои свойства, которые люди могут измерить и проанализировать, — они меняются в зависимости от взаимодействия друг с другом
    image: ill2_2.png
